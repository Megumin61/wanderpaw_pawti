<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="preload" as="image" href="./generated/chapters/chapter-01-capybara-v2-mobile.webp" type="image/webp" fetchpriority="high" media="(max-width: 640px)">
  <link rel="preload" as="image" href="./generated/chapters/chapter-01-capybara-v2.webp" type="image/webp" fetchpriority="high" media="(min-width: 641px)">
  <link rel="preload" as="image" href="./generated/quiz/scene-01-chengdu-arrival-v3-mobile.webp" type="image/webp" media="(max-width: 640px)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAWTI · 测测你是哪只毛孩子旅行人格</title>
  <meta name="description" content="PAWTI（Paw Traveller Indicator）· 每只毛孩子都是一种旅行人格，看看哪一只最像你的旅行方式。" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 字体：圆润粗体界面用 Noto Sans SC，叙事装饰保留 Noto Serif SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;600;700;800;900&family=Noto+Serif+SC:wght@400;500;700;900&family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- 本地样式 -->
  <link rel="stylesheet" href="./css/style.css" />

  <script>
    // Tailwind 主题扩展（PAWTI · 森系手帐绘本 · 米黄底 + 橄榄绿主色 + 焦糖橙点缀）
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paw: {
              // —— 基础纸本米色系（亮米白 · 暖米杏） ——
              cream:   '#FFFAF0',  // ★ 主背景顶部：亮米白
              fog:     '#FFFAF0',  // 信纸亮米
              peach:   '#FBEFDB',  // ★ 主背景底部 / 卡片底
              mist:    '#F5E7CD',  // 深米杏
              blush:   '#F5E2B8',  // 米黄高光
              tape:    '#FBEFDB',  // 手帐胶带米杏
              kraft:   '#E3CE99',  // 牛皮纸黄（按钮硬边阴影）

              // —— 主色：橄榄绿（统一只用 #687949） ——
              ink:     '#3D4A2A',  // 主文字：墨绿
              forest:  '#687949',  // ★ 唯一强调绿：按钮 / 标题 / 章戳
              fern:    '#687949',  // 与 forest 同色（保留兼容引用）
              moss:    '#9AAA7C',  // 浅苔（仅极少装饰用）
              sage:    '#BCC79E',  // 鼠尾草（仅极少装饰用）
              sprout:  '#D8DEB8',  // 嫩芽米绿
              pine:    '#3D4A2A',  // 深绿描边

              // —— 棕咖系（次要文字 · 用得克制） ——
              bark:    '#7C6B47',  // 棕墨（次文字）
              choco:   '#4A3A28',  // 深咖（选中态选项卡背景）
              coffee:  '#9A8560',  // 浅棕咖
              sand:    '#C4A878',  // 沙棕

              // —— 焦糖橘黄点缀（爪印徽章） ——
              apricot: '#E5A85A',  // ★ 焦糖橘黄
              lemon:   '#F0C870',  // 暖柠
              sun:     '#D89A3D',  // 暖琥珀
              berry:   '#687949',  // 旧 berry 改为同主绿，避免红色穿插
              sky:     '#A9C2BC',  // 雾青（不再使用）

              // —— 兼容旧引用 ——
              rust:    '#7C6B47',  // = bark
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans:  ['"Noto Sans SC"', '"Space Grotesk"', 'sans-serif'],
            mono:  ['"DM Mono"', 'monospace'],
            hand:  ['"Caveat"', '"Noto Serif SC"', 'cursive'],
          }
        }
      }
    };
  </script>
</head>

<body class="bg-paw-cream text-paw-ink font-sans antialiased overflow-x-hidden">
  <!-- 暖米黄→米杏柔和径向渐变（高级感底层） -->
  <div class="bg-gradient-layer pointer-events-none fixed inset-0 z-[0]"></div>
  <!-- 纸本质感底（极轻纹理 + 手帐网格点） -->
  <div class="noise-layer pointer-events-none fixed inset-0 z-[1]"></div>
  <div class="grid-dots-layer pointer-events-none fixed inset-0 z-[1]"></div>

  <!-- ============ 顶部迷你导航（手帐胶带风 · 橄榄绿主色） ============ -->
  <header id="site-header" class="fixed top-0 left-0 right-0 z-50 px-5 md:px-10 py-3 bg-paw-cream/93 backdrop-blur-sm border-b border-dashed border-paw-forest/25">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 relative">
      <!-- 左侧：圆形返回 + 品牌（牛皮纸订书钉风格） -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="w-10 h-10 rounded-full bg-paw-cream border-2 border-paw-forest flex items-center justify-center text-xl" style="box-shadow:2px 2px 0 #E3CE99;">
          🐾
        </div>
        <div class="leading-none">
          <span class="font-serif text-lg md:text-xl font-bold tracking-tight text-paw-ink">PAWTI</span>
        </div>
      </div>

      <!-- 答题时使用的顶部进度槽 -->
      <div id="quiz-progress-slot" class="hidden"></div>

      <!-- 中间：手帐胶带式标题（米杏胶带 + 墨绿字 · 微旋转） -->
      <div id="nav-slogan" class="hidden md:flex items-center">
        <div class="washi-tape px-6 py-2 flex items-center gap-2">
          <span class="text-paw-ink text-sm font-bold tracking-wide font-serif">小宠物试旅行</span>
          <span class="text-paw-apricot text-xs">✦</span>
          <span class="text-paw-bark/80 text-xs font-mono">代你写信</span>
        </div>
      </div>

      <!-- 右侧：开始按钮（橄榄绿实心 + 立体米色阴影） -->
      <div id="nav-start-wrap">
        <button id="nav-start-btn" class="btn-paw-ink-sm">
          <span>🐾</span>
          <span>带它出发</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 页面主内容：多 section 单页滚动 ============ -->
  <main id="app" class="relative z-10">

    <!-- Section 1 : Landing / Hero -->
    <section id="section-landing"></section>

    <!-- Section 2 : Quiz -->
    <section id="section-quiz" class="min-h-screen"></section>

    <!-- Section 3 : Result -->
    <section id="section-result" class="min-h-screen"></section>

  </main>

  <!-- ============ 页脚（手帐尾页风） ============ -->
  <footer class="site-footer relative z-10 border-t-2 border-dashed border-paw-forest/25 py-8 px-6 bg-paw-cream/60 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto flex flex-col items-center gap-3 text-sm text-paw-ink/70">
      <div class="flex items-center gap-2">
        <span>🌿</span>
        <span class="font-medium">PAWTI · 出门太难，那让小动物先替你看看远方</span>
      </div>
      <p class="font-mono text-xs tracking-widest text-paw-bark">WanderPaw 团队</p>
    </div>
  </footer>

  <!-- 脚本：ESModule -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
