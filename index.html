<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAWTI · 旅行人格测试 · 你是哪只毛孩子</title>
  <meta name="description" content="PAWTI（Paw Traveller Indicator）· 16 种旅行人格，16 只毛孩子替你出发 —— 一个比 MBTI 更治愈的旅行人格测试。" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 字体：中文用 Noto Serif SC（有质感）+ 英文用 Space Grotesk（现代感） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- 本地样式 -->
  <link rel="stylesheet" href="./css/style.css" />

  <script>
    // Tailwind 主题扩展
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paw: {
              cream: '#F7F1E8',
              peach: '#F3D5B5',
              apricot: '#E8A87C',
              rust:   '#C26D4D',
              ink:    '#2B2520',
              moss:   '#7B8A5F',
              sky:    '#A8C4D6',
              blush:  '#E8B4B8',
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans:  ['"Space Grotesk"', 'sans-serif'],
            mono:  ['"DM Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
</head>

<body class="bg-paw-cream text-paw-ink font-sans antialiased overflow-x-hidden">
  <!-- 噪点纹理覆盖层（全站） -->
  <div class="noise-layer pointer-events-none fixed inset-0 z-[1]"></div>

  <!-- ============ 顶部迷你导航 ============ -->
  <header class="fixed top-0 left-0 right-0 z-50 px-5 md:px-10 py-3.5 backdrop-blur-md bg-paw-cream/70 border-b border-paw-ink/5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <!-- 左侧：品牌 -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="text-2xl">🐾</span>
        <div class="flex flex-col leading-none">
          <span class="font-serif text-lg md:text-xl font-bold tracking-tight">PAWTI</span>
          <span class="text-[10px] text-paw-ink/50 tracking-widest mt-0.5 hidden sm:block">by WanderPaw</span>
        </div>
      </div>

      <!-- 中间：旅行 slogan -->
      <div id="nav-slogan" class="hidden md:flex items-center gap-3 text-sm text-paw-ink/65">
        <span>✈️ 让爪子替你出发</span>
        <span class="text-paw-ink/20">·</span>
        <span>🧳 16 种旅行人格</span>
        <span class="text-paw-ink/20">·</span>
        <span>🗺️ 16 只毛孩子</span>
      </div>

      <!-- 右侧：开始按钮 -->
      <div id="nav-start-wrap">
        <button id="nav-start-btn"
          class="px-4 py-2 bg-paw-ink text-paw-cream text-sm font-medium rounded-full hover:bg-paw-rust transition-all hover:scale-105 whitespace-nowrap">
          开始测试 →
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 页面主内容：多 section 单页滚动 ============ -->
  <main id="app" class="relative z-10">

    <!-- Section 1 : Landing / Hero -->
    <section id="section-landing"></section>

    <!-- Section 2 : Quiz -->
    <section id="section-quiz" class="min-h-screen"></section>

    <!-- Section 3 : Result -->
    <section id="section-result" class="min-h-screen"></section>

  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="relative z-10 border-t border-paw-ink/10 py-8 px-6 bg-paw-cream">
    <div class="max-w-7xl mx-auto flex flex-col items-center gap-3 text-sm text-paw-ink/60">
      <div class="flex items-center gap-2">
        <span>🐾</span>
        <span>PAWTI · 出门太难，那让爪子先去</span>
      </div>
      <p>由 <a href="https://with.woa.com/" style="color: #8A2BE2;" target="_blank">With</a> 通过自然语言生成</p>
    </div>
  </footer>

  <!-- 脚本：ESModule -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
